version: "3.9"

services:
  # ===========================================================================
  # PostgreSQL Database (port 5532)
  # ===========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: rqt-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-recursive_query_db}
      POSTGRES_USER: ${POSTGRES_USER:-rqt_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rqt_secure_password_2024}
    ports:
      - "${POSTGRES_EXTERNAL_PORT:-5532}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rqt_user} -d ${POSTGRES_DB:-recursive_query_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rqt-network
    restart: unless-stopped

  # ===========================================================================
  # Redis Cache/Message Broker (port 6478)
  # ===========================================================================
  redis:
    image: redis:7-alpine
    container_name: rqt-redis
    ports:
      - "${REDIS_EXTERNAL_PORT:-6478}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rqt-network
    restart: unless-stopped

  # ===========================================================================
  # ChromaDB Vector Store (port 8142)
  # ===========================================================================
  chromadb:
    image: chromadb/chroma:0.6.3
    container_name: rqt-chromadb
    ports:
      - "${CHROMA_EXTERNAL_PORT:-8142}:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/heartbeat')\" || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    networks:
      - rqt-network
    restart: unless-stopped

  # ===========================================================================
  # Langfuse Observability Platform (port 3084)
  # ===========================================================================
  langfuse:
    image: langfuse/langfuse:2
    container_name: rqt-langfuse
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${LANGFUSE_PORT:-3084}:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-rqt_user}:${POSTGRES_PASSWORD:-rqt_secure_password_2024}@postgres:5432/${POSTGRES_DB:-recursive_query_db}?schema=langfuse
      NEXTAUTH_URL: http://${HOST_IP:-172.168.1.95}:${LANGFUSE_PORT:-3084}
      NEXTAUTH_SECRET: langfuse-nextauth-secret-change-in-production
      SALT: langfuse-salt-change-in-production
      NEXT_PUBLIC_SIGN_UP_DISABLED: ${NEXT_PUBLIC_SIGN_UP_DISABLED:-false}
      LANGFUSE_INIT_ORG_ID: ${LANGFUSE_INIT_ORG_ID:-rqt-org}
      LANGFUSE_INIT_ORG_NAME: ${LANGFUSE_INIT_ORG_NAME:-RQT Organization}
      LANGFUSE_INIT_PROJECT_ID: ${LANGFUSE_INIT_PROJECT_ID:-rqt-project}
      LANGFUSE_INIT_PROJECT_NAME: ${LANGFUSE_INIT_PROJECT_NAME:-Recursive Query Tuning}
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_INIT_PROJECT_PUBLIC_KEY:-pk-lf-rqt-dev}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_INIT_PROJECT_SECRET_KEY:-sk-lf-rqt-dev}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL:-admin@rqt.local}
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD:-admin123}
      LANGFUSE_INIT_USER_NAME: ${LANGFUSE_INIT_USER_NAME:-Admin}
    networks:
      - rqt-network
    restart: unless-stopped

  # ===========================================================================
  # Django Backend - AI/ML Engine (port 8043)
  # ===========================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rqt-backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8043}:8043"
    volumes:
      - ./backend:/app
      - ./agentic_ai_research_papers.zip:/app/data/agentic_ai_research_papers.zip
      - upload_data:/app/media/uploads
      - chroma_data:/app/chroma_data
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=core.settings
      - PYTHONUNBUFFERED=1
    networks:
      - rqt-network
    restart: unless-stopped

  # ===========================================================================
  # Node.js API Gateway (port 3083)
  # ===========================================================================
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: rqt-gateway
    depends_on:
      - backend
    ports:
      - "${GATEWAY_PORT:-3083}:3083"
    volumes:
      - ./gateway/src:/app/src
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - PORT=3083
      - BACKEND_URL=http://backend:8043
      - REDIS_URL=redis://redis:6379/0
    # Recompile TS from volume-mounted src/ so code changes take effect
    # on restart without a full image rebuild.
    command: sh -c "npx tsc && node dist/index.js"
    networks:
      - rqt-network
    restart: unless-stopped

  # ===========================================================================
  # React Frontend via Nginx (port 3082 - Main Site)
  # ===========================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - REACT_APP_GATEWAY_URL=http://${HOST_IP:-172.168.1.95}:${GATEWAY_PORT:-3083}
        - REACT_APP_WS_URL=ws://${HOST_IP:-172.168.1.95}:${GATEWAY_PORT:-3083}
        - REACT_APP_LANGFUSE_URL=http://${HOST_IP:-172.168.1.95}:${LANGFUSE_PORT:-3084}
    container_name: rqt-frontend
    depends_on:
      - gateway
    ports:
      - "${FRONTEND_PORT:-3082}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - rqt-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  chroma_data:
    driver: local
  upload_data:
    driver: local

networks:
  rqt-network:
    driver: bridge
    name: rqt-network
